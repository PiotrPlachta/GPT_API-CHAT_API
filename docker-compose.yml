version: '3.8'

services:
  backend:
    build: ./backend
    container_name: chat-api-backend
    volumes:
      - ./backend:/app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ORDER_API_ENDPOINT=${ORDER_API_ENDPOINT}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: chat-api-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
